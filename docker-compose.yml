version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-release-agent-backend
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=production
      # Uncomment and fill these in your local .env or pass them here
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
      # - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      # - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      # - SOCIAL_SERVICE_URL=http://social-post-service:3012
      # - LYRICS_SERVICE_URL=http://lyrics-vault-service:3013
    volumes:
      - ./data:/usr/src/app/data
      - ./spotify_tokens.json:/usr/src/app/spotify_tokens.json

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: music-release-agent-dashboard
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Optional: Mocking the social-post-service if it's cloned adjacently
  # social-post-service:
  #   build:
  #     context: ../social-post-service
  #     dockerfile: Dockerfile
  #   container_name: social-post-service
  #   ports:
  #     - "3012:3012"

  # Optional: lyrics-vault-service if it's cloned adjacently
  # （未啟動時 /api/lyrics 回 502、前端顯示「歌詞服務暫時離線」，核心不受影響）
  # lyrics-vault-service:
  #   build:
  #     context: ../lyrics-vault-service
  #     dockerfile: Dockerfile
  #   container_name: lyrics-vault-service
  #   ports:
  #     - "3013:3013"
  #   volumes:
  #     - ./data/lyrics-vault:/usr/src/app/data/lyrics-vault
