<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 48 48">
  <defs>
    <!-- 定義綠色漸層，契合 Spotify 配色 -->
    <linearGradient id="musicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1db954" />
      <stop offset="100%" stop-color="#1aa34a" />
    </linearGradient>
    <!-- 定義背景深色漸層 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#212121" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <!-- 微陰影效果 -->
    <filter id="shadow" width="120%" height="120%" x="-10%" y="-10%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 圓角背景 -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)" />
  
  <!-- 音符主體 -->
  <g filter="url(#shadow)">
    <!-- 雙音符符桿與連接桿 -->
    <path d="M18 30V12l18-4v18" stroke="url(#musicGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 橫向連接旗幟的填充區 -->
    <path d="M18 12l18-4v4l-18 4z" fill="url(#musicGrad)" opacity="0.9" />
    <!-- 左側音符符頭 -->
    <ellipse cx="14" cy="32" rx="6" ry="4.5" fill="url(#musicGrad)" transform="rotate(-15 14 32)" />
    <!-- 右側音符符頭 -->
    <ellipse cx="32" cy="28" rx="6" ry="4.5" fill="url(#musicGrad)" transform="rotate(-15 32 28)" />
  </g>
</svg>