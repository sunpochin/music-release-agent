name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/*", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies (Backend)
      run: npm ci

    - name: Install dependencies (Dashboard)
      run: cd dashboard && npm ci

    - name: Build Dashboard
      run: cd dashboard && npm run build

    - name: Run Unit Tests
      run: npm run test

    - name: Verify Dry Run Sandbox
      run: npm run demo:verify

    - name: Verify Cross-Service Handoff (built-in mock)
      run: npm run demo:verify:social

    - name: Verify Failure Mode (companion service down)
      run: npm run demo:verify:social:down

    - name: Verify Lyrics Handoff (built-in mock)
      run: npm run demo:verify:lyrics
      env:
        FORCE_MOCK_LYRICS: 'true'

    - name: Verify Lyrics Failure Mode (companion service down)
      run: npm run demo:verify:lyrics:down

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E Tests
      run: npm run test:e2e

    - name: Build Backend Docker Image
      run: docker build -t music-release-agent-backend:ci .

    - name: Build Dashboard Docker Image
      run: docker build -t music-release-agent-dashboard:ci ./dashboard
